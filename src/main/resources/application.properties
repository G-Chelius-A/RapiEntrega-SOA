spring.application.name=rapientrega

# Cargar variables desde archivo .env en la raíz del proyecto
spring.config.import=optional:file:./.env[.properties]

# Configuración de base de datos MySQL (con soporte para variables de entorno)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rapientrega?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

server.port=6767
